name: Docker

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 23 * * *'

permissions:
  contents: read

jobs:
  build:
    name: Pull
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check disk space before expansion
        shell: bash
        run: |
          df -hP /
          df -iP /

      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 16384
          swap-size-mb: 128
          remove-dotnet: 'true'
          remove-haskell: 'true'
          remove-android: 'true'
          remove-codeql: 'true'
          build-mount-path: /mnt/ci-docker-storage

      - name: Move Docker and containerd storage to expanded volume
        shell: bash
        run: |
          set -euo pipefail

          storage=/mnt/ci-docker-storage

          # 扩容目录必须是独立挂载点。
          mountpoint -q "$storage"

          sudo systemctl stop docker.socket docker.service
          sudo systemctl stop containerd.service

          sudo mkdir -p "$storage/docker" "$storage/containerd"
          sudo mkdir -p /var/lib/docker /var/lib/containerd

          sudo mount --bind "$storage/docker" /var/lib/docker
          sudo mount --bind "$storage/containerd" /var/lib/containerd

          sudo systemctl start containerd.service
          sudo systemctl start docker.service

          echo "检查 Docker 存储驱动和实际挂载"
          docker info --format 'Driver={{.Driver}} DriverStatus={{json .DriverStatus}} DockerRootDir={{.DockerRootDir}}'
          findmnt --mountpoint /var/lib/docker
          findmnt --mountpoint /var/lib/containerd

          echo "检查根分区和镜像存储容量"
          df -hP / /home/runner /var/lib/docker /var/lib/containerd
          df -iP / /home/runner /var/lib/docker /var/lib/containerd

      - name: Pull and push images to Aliyun ACR
        shell: bash
        env:
          ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
          ALIYUN_NAME_SPACE: ${{ secrets.ALIYUN_NAME_SPACE }}
          ALIYUN_REGISTRY_USER: ${{ secrets.ALIYUN_REGISTRY_USER }}
          ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail

          declare -a sources=()
          declare -a platforms=()
          declare -a namespaces=()
          declare -a names=()
          declare -a tags=()
          declare -A first_namespace=()
          declare -A duplicate_images=()

          line_number=0
          while IFS= read -r line || [[ -n "$line" ]]; do
            line_number=$((line_number + 1))
            line=${line%$'\r'}
            line=${line%%#*}
            read -r -a fields <<< "$line"

            platform=""
            case "${#fields[@]}:${fields[0]:-}" in
              0:)
                continue
                ;;
              1:*)
                image=${fields[0]}
                ;;
              2:--platform=*)
                platform=${fields[0]#--platform=}
                image=${fields[1]}
                ;;
              3:--platform)
                platform=${fields[1]}
                image=${fields[2]}
                ;;
              *)
                echo "::error file=images.txt,line=$line_number::镜像条目格式错误"
                exit 1
                ;;
            esac

            if [[ "$image" == -* ]] ||
               [[ "${fields[0]}" == --platform* && -z "$platform" ]]; then
              echo "::error file=images.txt,line=$line_number::缺少镜像名或平台"
              exit 1
            fi

            # 拉取时保留源引用中的 digest，生成目标标签时去掉 digest。
            repository=${image%%@*}
            name_tag=${repository##*/}
            name=${name_tag%%:*}
            tag=latest
            if [[ "$name_tag" == *:* ]]; then
              tag=${name_tag#*:}
            fi

            if [[ -z "$name" || -z "$tag" ]]; then
              echo "::error file=images.txt,line=$line_number::缺少镜像名或标签"
              exit 1
            fi

            namespace=""
            IFS=/ read -r -a parts <<< "$repository"
            case "${#parts[@]}" in
              2) namespace=${parts[0]} ;;
              3) namespace=${parts[1]} ;;
            esac

            if [[ ${first_namespace[$name]+set} ]]; then
              if [[ "${first_namespace[$name]}" != "$namespace" ]]; then
                duplicate_images[$name]=true
              fi
            else
              first_namespace[$name]=$namespace
            fi

            sources+=("$image")
            platforms+=("$platform")
            namespaces+=("$namespace")
            names+=("$name")
            tags+=("$tag")
          done < images.txt

          total=${#sources[@]}
          if [[ "$total" -eq 0 ]]; then
            echo "images.txt 没有需要同步的镜像。"
            exit 0
          fi

          # 登录配置仅供当前步骤使用。
          umask 077
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d "$RUNNER_TEMP/docker-config.XXXXXX")
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT

          echo "登录阿里云 ACR"
          printf '%s\n' "$ALIYUN_REGISTRY_PASSWORD" |
            docker login "$ALIYUN_REGISTRY" \
              --username "$ALIYUN_REGISTRY_USER" --password-stdin

          for i in "${!sources[@]}"; do
            image=${sources[$i]}
            platform=${platforms[$i]}
            namespace=${namespaces[$i]}
            name=${names[$i]}
            tag=${tags[$i]}
            item_number=$((i + 1))
            selected_platform=${platform:-linux/amd64}

            prefix=""
            if [[ -n "$platform" ]]; then
              prefix="${platform//\//_}_"
            fi
            if [[ ${duplicate_images[$name]+set} && -n "$namespace" ]]; then
              prefix="${prefix}${namespace}_"
            fi

            target_tag="${prefix}${name}:${tag}"
            target="${ALIYUN_REGISTRY}/${ALIYUN_NAME_SPACE}/${target_tag}"

            echo "[$item_number/$total] 开始拉取 $image（平台 $selected_platform）"
            started=$SECONDS
            docker pull --platform "$selected_platform" "$image"
            echo "拉取完成，耗时 $((SECONDS - started)) 秒"

            docker tag "$image" "$target"

            echo "[$item_number/$total] 开始推送 $target_tag 到 ACR"
            started=$SECONDS
            docker push "$target"
            echo "推送完成 $target_tag，耗时 $((SECONDS - started)) 秒"

            # 推送成功后移除本地镜像引用。
            docker image rm "$target" "$image"

            echo "清理后剩余空间"
            df -hP / /var/lib/docker /var/lib/containerd
          done

          echo "全部同步完成，共 $total 个镜像。"
