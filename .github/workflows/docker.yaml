name: Docker

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 23 * * *'

permissions:
  contents: read

jobs:
  build:
    name: Pull
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install regctl
        shell: bash
        run: |
          curl -fsSL --retry 3 \
            https://github.com/regclient/regclient/releases/latest/download/regctl-linux-amd64 \
            -o "$RUNNER_TEMP/regctl"
          chmod 755 "$RUNNER_TEMP/regctl"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Sync images to Aliyun ACR
        shell: bash
        env:
          ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
          ALIYUN_NAME_SPACE: ${{ secrets.ALIYUN_NAME_SPACE }}
          ALIYUN_REGISTRY_USER: ${{ secrets.ALIYUN_REGISTRY_USER }}
          ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail

          declare -a sources=()
          declare -a platforms=()
          declare -a namespaces=()
          declare -a names=()
          declare -a tags=()
          declare -A first_namespace=()
          declare -A duplicate_images=()

          line_number=0

          while IFS= read -r line || [[ -n "$line" ]]; do
            line_number=$((line_number + 1))
            line=${line%$'\r'}
            line=${line%%#*}
            read -r -a fields <<< "$line"

            platform=""
            case "${#fields[@]}:${fields[0]:-}" in
              0:)
                continue
                ;;
              1:*)
                image=${fields[0]}
                ;;
              2:--platform=*)
                platform=${fields[0]#--platform=}
                image=${fields[1]}
                ;;
              3:--platform)
                platform=${fields[1]}
                image=${fields[2]}
                ;;
              *)
                echo "::error file=images.txt,line=$line_number::镜像条目格式错误"
                exit 1
                ;;
            esac

            if [[ "$image" == -* ]] ||
               [[ "${fields[0]}" == --platform* && -z "$platform" ]]; then
              echo "::error file=images.txt,line=$line_number::缺少镜像名或平台"
              exit 1
            fi

            # 保留原始引用用于复制，去掉 digest 后计算目标名称。
            repository=${image%%@*}
            name_tag=${repository##*/}
            name=${name_tag%%:*}
            tag=latest
            if [[ "$name_tag" == *:* ]]; then
              tag=${name_tag#*:}
            fi

            if [[ -z "$name" || -z "$tag" ]]; then
              echo "::error file=images.txt,line=$line_number::缺少镜像名或标签"
              exit 1
            fi

            namespace=""
            IFS=/ read -r -a parts <<< "$repository"
            case "${#parts[@]}" in
              2) namespace=${parts[0]} ;;
              3) namespace=${parts[1]} ;;
            esac

            if [[ ${first_namespace[$name]+set} ]]; then
              if [[ "${first_namespace[$name]}" != "$namespace" ]]; then
                duplicate_images[$name]=true
              fi
            else
              first_namespace[$name]=$namespace
            fi

            sources+=("$image")
            platforms+=("$platform")
            namespaces+=("$namespace")
            names+=("$name")
            tags+=("$tag")
          done < images.txt

          if [[ ${#sources[@]} -eq 0 ]]; then
            echo "images.txt 没有需要同步的镜像。"
            exit 0
          fi

          export REGCTL_CONFIG="$RUNNER_TEMP/regctl-config.json"
          umask 077
          trap 'rm -f -- "$REGCTL_CONFIG"' EXIT

          echo "登录阿里云 ACR"
          printf '%s\n' "$ALIYUN_REGISTRY_PASSWORD" |
            timeout --kill-after=10s 60s \
              regctl registry login "$ALIYUN_REGISTRY" \
                -u "$ALIYUN_REGISTRY_USER" --pass-stdin

          for i in "${!sources[@]}"; do
            image=${sources[$i]}
            platform=${platforms[$i]}
            namespace=${namespaces[$i]}
            name=${names[$i]}
            tag=${tags[$i]}
            selected_platform=${platform:-linux/amd64}
            item_number=$((i + 1))

            prefix=""
            if [[ -n "$platform" ]]; then
              prefix="${platform//\//_}_"
            fi
            if [[ ${duplicate_images[$name]+set} && -n "$namespace" ]]; then
              prefix="${prefix}${namespace}_"
            fi

            target="${ALIYUN_REGISTRY}/${ALIYUN_NAME_SPACE}/${prefix}${name}:${tag}"

            echo "[$item_number/${#sources[@]}] 检查源镜像 $image（平台 $selected_platform）"
            if timeout --kill-after=10s 60s \
                regctl image manifest --platform "$selected_platform" "$image" >/dev/null; then
              echo "源镜像清单读取成功，开始复制到 ACR"
            else
              status=$?
              if [[ "$status" -eq 124 || "$status" -eq 137 ]]; then
                echo "::error::源镜像清单查询超时，镜像 $image，退出码 $status"
              else
                echo "::error::源镜像清单读取失败，镜像 $image，退出码 $status"
              fi
              exit "$status"
            fi

            started=$SECONDS
            if timeout --kill-after=15s 45m \
                regctl image copy --verbosity info \
                  --platform "$selected_platform" "$image" "$target"; then
              echo "同步完成 $image，目标标签 ${prefix}${name}:${tag}，耗时 $((SECONDS - started)) 秒"
            else
              status=$?
              if [[ "$status" -eq 124 || "$status" -eq 137 ]]; then
                echo "::error::复制超时，镜像 $image，退出码 $status"
              else
                echo "::error::复制失败，镜像 $image，退出码 $status"
              fi
              exit "$status"
            fi
          done

          echo "全部同步完成，共 ${#sources[@]} 个镜像。"
